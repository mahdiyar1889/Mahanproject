<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد مدیریتی پارس پرنون</title>
    
    <!-- اتصال به فایل استایل -->
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

    <!-- بخش ورود به سامانه (Login) -->
    <div id="login-overlay">
        <div class="login-box">
            <!-- لوگوی شرکت -->
            <img src="assets/logo.jpg" alt="آرم شرکت" class="company-logo">
            
            <h2>ورود به سامانه</h2>
            <input type="text" id="username" placeholder="نام کاربری" />
            <input type="password" id="password" placeholder="رمز عبور" />
            <button onclick="checkLogin()">ورود</button>
        </div>
    </div>

    <!-- بخش اصلی نرم‌افزار (داشبورد نقشه) -->
    <div id="app-wrapper">
        <div class="dashboard-container">
            
            <!-- منوی سمت راست -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>لیست پروژه‌ها</h2>
                    <p>برای مشاهده نقشه و جزئیات، روی هر پروژه کلیک کنید</p>
                    <button class="btn-main" onclick="changeMap('image_715aa8.jpg')">نمایش نقشه کلی شهرک</button>
                </div>

                <!-- لیست پهنه‌ها -->
                <div class="zone-list">
                    <button class="zone-item" onclick="changeMap('assets/map-g1.jpg')">
                        <span>پهنه G1 - عرصه ساحلی</span>
                        <span class="arrow">⌄</span>
                    </button>
                    <button class="zone-item" onclick="changeMap('assets/map-g2.jpg')">
                        <span>پهنه G2 - پارک جنگلی</span>
                        <span class="arrow">⌄</span>
                    </button>
                    <button class="zone-item" onclick="changeMap('assets/map-g3.jpg')">
                        <span>پهنه G3 - عرصه میانی</span>
                        <span class="arrow">⌄</span>
                    </button>
                    <button class="zone-item" onclick="changeMap('assets/map-g4.jpg')">
                        <span>پهنه G4 - حریم هیدرولوژیک</span>
                        <span class="arrow">⌄</span>
                    </button>
                    <button class="zone-item" onclick="changeMap('assets/map-g5.jpg')">
                        <span>پهنه G5 - کمربند سبز</span>
                        <span class="arrow">⌄</span>
                    </button>
                    <button class="zone-item" onclick="changeMap('assets/map-s1.jpg')">
                        <span>پهنه S1 - عرصه ورودی</span>
                        <span class="arrow">⌄</span>
                    </button>
                </div>
            </aside>

            <!-- نمایشگر نقشه سمت چپ -->
            <main class="map-viewer">
                <div class="map-frame">
                    <!-- تصویر پیش‌فرض (تصویر اصلی نقشه) -->
                    <img id="active-map" src="image_715aa8.jpg" alt="نقشه منطقه">
                </div>
            </main>
            
        </div>
    </div>

    <!-- اتصال به فایل‌های جاوااسکریپت -->
    <script src="assets/dashboard-data.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
