<script>
    function checkLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      if (user === "mahanproject" && pass === "parnoun135") {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
      } else {
        alert("نام کاربری یا رمز عبور اشتباه است");
      }
    }

    // --- کدهای جدید برای ورود و دانلود خودکار ---
    window.onload = function() {
      // دریافت پارامترهای موجود در لینک
      const urlParams = new URLSearchParams(window.location.search);
      
      // اگر در لینک پارامتر autologin برابر با true بود
      if (urlParams.get('autologin') === 'true') {
        
        // ۱. پر کردن خودکار فیلدها و ورود به سیستم
        document.getElementById('username').value = "mahanproject";
        document.getElementById('password').value = "parnoun135";
        checkLogin();

        // ۲. بررسی برای دانلود خودکار
        if (urlParams.get('download') === 'arch') {
          
          // لینک فایل معماری مرحله دوم شما (همان که در dashboard-data.js گذاشتید)
          // نکته: برای دانلود مستقیم از گوگل درایو، فرمت لینک را به شکل زیر تغییر داده‌ام
          const fileUrl = "https://drive.google.com/uc?export=download&id=1asZisCWdqGsCo_yWdnuUvszkOqi_y_JE";
          
          // یک ثانیه تاخیر می‌دهیم تا کاربر محیط داشبورد را ببیند و سپس دانلود شروع شود
          setTimeout(() => {
            window.location.href = fileUrl;
          }, 1500);
        }
      }
    };
  </script>
