<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد مدیریتی پارس پرنون</title>
    
    <!-- اتصال به فایل استایل -->
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

    <!-- بخش ورود به سامانه (Login) -->
    <div id="login-overlay">
        <div class="login-box">
            <!-- لوگوی شرکت -->
            <img src="assets/logo.jpg" alt="آرم شرکت" class="company-logo">
            
            <h2>ورود به سامانه</h2>
            <input type="text" id="username" placeholder="نام کاربری" />
            <input type="password" id="password" placeholder="رمز عبور" />
            <button onclick="checkLogin()">ورود</button>
        </div>
    </div>

    <!-- بخش اصلی نرم‌افزار (داشبورد نقشه) -->
    <div id="app-wrapper">
        <div class="dashboard-container">
            
            <!-- منوی سمت راست -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>لیست نقشه‌ها</h2>
                    <p>برای مشاهده نقشه و جزئیات، روی هر مورد کلیک کنید</p>
                    <button class="btn-main" onclick="changeMap('image_715aa8.jpg')">نمایش تصویر اصلی پروژه</button>
                </div>

                <!-- این بخش (menu-container) توسط جاوااسکریپت و از روی دیتای شما به صورت خودکار پر می‌شود -->
                <div class="zone-list" id="menu-container">
                    <!-- دکمه‌ها اینجا لود می‌شوند -->
                </div>
            </aside>

            <!-- نمایشگر نقشه سمت چپ -->
            <main class="map-viewer">
                <div class="map-frame">
                    <!-- تصویر پیش‌فرض -->
                    <img id="active-map" src="image_715aa8.jpg" alt="نقشه منطقه">
                </div>
            </main>
            
        </div>
    </div>

    <!-- اتصال به فایل دیتای شما و سپس منطق برنامه -->
    <script src="assets/dashboard-data.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
