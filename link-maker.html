<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لینک‌ساز اختصاصی مدیران</title>
  <style>
    body { font-family: Tahoma, Arial; background: #eef3f8; padding: 40px; display: flex; justify-content: center; }
    .panel { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { color: #1e293b; margin-top: 0; text-align: center; }
    label { font-size: 14px; color: #475569; font-weight: bold; display: block; margin: 15px 0 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: Tahoma; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #245eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .result-box { margin-top: 20px; padding: 15px; background: #f8fbff; border: 1px dashed #245eea; border-radius: 6px; display: none; }
    textarea { width: 100%; height: 80px; margin-top: 10px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; box-sizing: border-box; direction: ltr; resize: none; font-family: monospace; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>ساخت لینک دانلود محافظت شده</h2>
    
    <label>نام فایلی که می‌خواهید نمایش داده شود:</label>
    <input type="text" id="fileName" placeholder="مثال: نقشه های فاز دو - طبقه اول" />

    <label>آدرس (لینک) مستقیم فایل آپلود شده:</label>
    <input type="text" id="fileUrl" placeholder="لینک فایل در گوگل درایو یا گیت‌هاب" dir="ltr" />

    <button onclick="generateLink()">تولید لینک نهایی</button>

    <div class="result-box" id="resultBox">
      <label>لینک زیر را کپی کرده و برای شخص بفرستید:</label>
      <textarea id="finalLink" readonly></textarea>
    </div>
  </div>

  <script>
    function generateLink() {
      const name = document.getElementById('fileName').value;
      const url = document.getElementById('fileUrl').value;
      
      if(!name || !url) {
          alert("لطفا هم نام فایل و هم لینک فایل را وارد کنید.");
          return;
      }

      // آدرس پایه صفحه دانلود شما در گیت‌هاب
      const baseUrl = "https://mahdiyar1889.github.io/Mahanproject/download.html";
      
      // ساخت لینک نهایی با رمزنگاری کاراکترهای فارسی
      const finalUrl = `${baseUrl}?name=${encodeURIComponent(name)}&url=${encodeURIComponent(url)}`;
      
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('finalLink').value = finalUrl;
    }
  </script>

</body>
</html>
